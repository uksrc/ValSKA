name: "Setup Conda Environment" 
description: "Restore cache and install environment using Micromamba"

runs: 
  using: composite
  steps:
    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: valska
        environment-file: valska_env_base.yaml
        init-shell: bash
        cache-environment: true
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
          channel_priority: strict